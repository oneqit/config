"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 1000

format = """
$time\
$directory\
$git_branch$git_status\
$c$cpp$rust$golang$nodejs$java$kotlin$python\
$kubernetes\
$cmd_duration\
$line_break\
${custom.ssh}$character"""

[time]
disabled = false
time_format = "%T"
format = '\[[$time]($style)\] '

[directory]
read_only = " 󰌾"
truncation_length = 6
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = ""
format = '[$symbol $branch(:$remote_branch)]($style) '

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '

[c]
format = '[$symbol($version)]($style) '

[cpp]
format = '[$symbol($version)]($style) '

[rust]
format = '[$symbol($version)]($style) '

[golang]
format = '[$symbol($version)]($style) '

[nodejs]
format = '[$symbol($version)]($style) '

[java]
format = '[$symbol($version)]($style) '

[kotlin]
format = '[$symbol($version)]($style) '

[python]
format = '[$symbol($version)]($style) '

[cmd_duration]
min_time = 2000
format = '[ $duration]($style) '

[line_break]
disabled = false

[custom.ssh]
# Inside tmux, read the session env, which tmux refreshes from the client on each attach (update-environment)
when = '''{ if [ -n "$TMUX" ]; then tmux show-env SSH_CONNECTION 2>/dev/null | sed -n 's/^SSH_CONNECTION=//p'; else echo "$SSH_CONNECTION"; fi; } | grep -q .'''
command = '''{ if [ -n "$TMUX" ]; then tmux show-env SSH_CONNECTION 2>/dev/null | sed -n 's/^SSH_CONNECTION=//p'; else echo "$SSH_CONNECTION"; fi; } | awk '{print $3}''''
style = 'bold #ff9e64'
format = '[󰌘 $output]($style) '
